<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-PAJVOlSxWMFEuivXZmqdG9AVOyt8nmyFA92Ee4lNZ9o='; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'"><title>메리츠 키 오프라인 암호화</title><style>body{max-width:540px;margin:auto;padding:24px;font:17px/1.7 system-ui;background:#f4f6fa;color:#182234}label,input,button{display:block;width:100%;box-sizing:border-box}input,button{padding:14px;margin:8px 0 24px;font-size:17px}#status{font-weight:bold}a{overflow-wrap:anywhere}</style><h1>메리츠 API 키 암호화</h1><p>외부 전송·분석 도구·브라우저 저장 기능이 없습니다. 입력값은 이 브라우저에서 암호화되며 복호화 개인키는 PC에만 있습니다.</p><p id="status">준비 확인 중…</p><p><b>지금은 실제 키를 입력하지 마세요.</b> 먼저 이 화면에서 초록색 ‘준비 완료’가 보이는지만 확인해 주세요.</p><form autocomplete="off"><label for="appkey">App Key</label><input id="appkey" type="password" autocomplete="off" required disabled><label for="appsecret">App Secret</label><input id="appsecret" type="password" autocomplete="off" required disabled><button disabled>암호화 파일 저장</button></form><div id="download"></div><p>휴대폰에서 파일이 열리지 않으면 중단하고 알려주세요. 키를 채팅으로 보내지 마세요. 이 파일은 24시간 뒤 만료됩니다.</p><script>const META={"version": 1, "application": "meritz-market-data-only", "request_id": "2c75719cf7a3c4e5b9b06818d42c3aac", "expires_at": "2026-11-09T16:14:04.412071+00:00", "algorithm": "RSA-OAEP-SHA256"},PUBLIC_KEY='MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAqV8lLgHxFWQpGu6hKFEZ5i5AWOcFKAnLjAPAQvHvxpoGyH1Isvz0riNquZb0PPDQYHKSTzymLEbxPIgJ0zwlsGK22GKUKu8Mz7eCvldsjyj/5vYCkKsTT729I+FCdcJZ/UT1KL9wkY7WQrgVJdHih2Dm5slLC8liFvwbMGbosbYROXrzi3wwp8immmJu6wcvqaOObiTz2A9zX9T4L9V8nQfVlIst/Hn1qLtwXR4KDI5C25Lp1Owq6mjGl4YJkKACQWrhxwkDE0ladANJXM438ddQNGZUvwVqEe7WFTZKEAe7k8IxttzhLR4UBTCneGhWDlMIc76nGyWMPyoc+N5XubKOGmrsTq7iGs+n58H9pdUP9dODgWm9jBo8fbt3E3+L7cQv5p5bp+kTPBdkVojwTIXIgBrGBy5dZMePOh83wmgQmwi/Q8TC6uX/9HXzvyvNefIjNcBRGzBd/VZ4s11ka const status=document.querySelector('#status'),form=document.querySelector('form');
const keyInput=document.querySelector('#appkey'),secretInput=document.querySelector('#appsecret');
let key;
const label=()=>new TextEncoder().encode(META.application+'|'+META.request_id);
async function encryptPacket(appKey,appSecret){
 if(!key||Date.now()>=Date.parse(META.expires_at))throw Error('만료 또는 암호화 준비 실패');
 const text=JSON.stringify({app_key:appKey,app_secret:appSecret});

 if(data.length>318)throw Error('입력 길이가 너무 깁니다. 키 두 개만 입력하세요.');

 return {...META,ciphertext:btoa(String.fromCharCode(...new Uint8Array(result)))};

(async()=>{try{
