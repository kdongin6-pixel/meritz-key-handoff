<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-sUwfU08q+cX6PaiX7QHB+JFBxNpNUKB5Bduljf5Ytiw='; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'"><title>한국투자증권 키 오프라인 암호화</title><style>body{max-width:540px;margin:auto;padding:24px;font:17px/1.7 system-ui;background:#f4f6fa;color:#182234}label,input,button{display:block;width:100%;box-sizing:border-box}input,button{padding:14px;margin:8px 0 24px;font-size:17px}#status{font-weight:bold}a{overflow-wrap:anywhere}</style><h1>한국투자증권 API 키 암호화</h1><p>외부 전송·분석 도구·브라우저 저장 기능이 없습니다. 입력값은 이 브라우저에서 암호화되며 복호화 개인키는 PC에만 있습니다.</p><p id="status">준비 확인 중…</p><p><b>지금은 실제 키를 입력하지 마세요.</b> 먼저 이 화면에서 초록색 ‘준비 완료’가 보이는지만 확인해 주세요.</p><form autocomplete="off"><label for="appkey">App Key</label><input id="appkey" type="password" autocomplete="off" required disabled><label for="appsecret">App Secret</label><input id="appsecret" type="password" autocomplete="off" required disabled><button disabled>암호화 파일 저장</button></form><div id="download"></div><p>휴대폰에서 파일이 열리지 않으면 중단하고 알려주세요. 키를 채팅으로 보내지 마세요. 이 파일은 24시간 뒤 만료됩니다.</p><script>const META={"version": 1, "application": "kis-isa-account-read", "request_id": "2fe6a1e416663ad78604efbabec5fe9f", "expires_at": "2026-11-09T19:17:05.468893+00:00", "algorithm": "RSA-OAEP-SHA256"},PUBLIC_KEY='MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAw/JcKu3ngCRdykqJN4k6yL96agaX02kzwiuPz+1kq3w7eowejBLD15ksHN8x/IVV7/k+LPiVM1g4ZopMYUJj1rSFaLJ8rz9npaIDdQgFirwEgY6+7itWNhrwX70D5mQXMjXMLTCROnUL1lAP/5PJs85BwjGn6SCqhMDspQCpspSHD14Sp5hcz+UfG0j5NkLNlUXSzs1uf4/7eqLMJNsYCZpxjo3vY0q4VidS17Q2dWBv4ieBaA0BFMxmQ7WTHRRGDZqiQ2ZEB+6Gtaq+h2/TOYo8VNCM6KMOcvX9dPeTrerXt+KlxPve4XrLk05NBh8adMgFSKarEdqkClUQVN1Qh4qUbaPuOPZFV8qYrCeIWafv//WC2rREyJGrtXc6590wRxg28joq1741aX3dnp79ai8ldXGESS9/a3rR3H3NaEoFwrHOKVI4sZbnLW6l05QBVZzhZArs9qq8xPWc4D const status=document.querySelector('#status'),form=document.querySelector('form');
const keyInput=document.querySelector('#appkey'),secretInput=document.querySelector('#appsecret');
let key;
const label=()=>new TextEncoder().encode(META.application+'|'+META.request_id);
async function encryptPacket(appKey,appSecret){
 if(!key||Date.now()>=Date.parse(META.expires_at))throw Error('만료 또는 암호화 준비 실패');
 const text=JSON.stringify({app_key:appKey,app_secret:appSecret});
 const data=new TextEncoder().encode(text);
 if(data.length>318)throw Error('입력 길이가 너무 깁니다. 키 두 개만 입력하세요.');
 const result=await crypto.subtle.encrypt({name:'RSA-OAEP',label:label()},key,data);
 return {...META,ciphertext:btoa(String.fromCharCode(...new Uint8Array(result)))};
}
(async()=>{try{

 if(Date.now()>=Date.parse(META.expires_at))throw Error('입력 도구가 만료됐습니다');

form.addEventListener('submit',async e=>{e.preventDefault();try{
